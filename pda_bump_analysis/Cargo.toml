[workspace]

[package]
name = "pda_bump_analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program = "1.17"
borsh = "0.10"
thiserror = "1.0"
spl-token = "4.0"

[dev-dependencies]
solana-program-test = "1.17"
solana-sdk = "1.17"
tokio = { version = "1", features = ["full"] }

[lib]
crate-type = ["cdylib", "lib"]
name = "pda_bump_analysis"

[[bin]]
name = "exploit_demo"
path = "src/exploit_demo.rs"